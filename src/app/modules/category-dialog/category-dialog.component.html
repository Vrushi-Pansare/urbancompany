<!-- Category Dialog: related service groups for a category -->
<div class="uc-category-overlay" *ngIf="category" (click)="close()">
  <div
    class="uc-category-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="uc-category-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <!-- Mobile drag handle (visual only) -->
    <div class="uc-sheet-handle"></div>

    <!-- Header -->
    <div class="uc-category-dialog-header">
      <h2 id="uc-category-dialog-title" class="uc-category-dialog-title">{{ category.name }}</h2>
      <button type="button" class="uc-dialog-close-btn" aria-label="Close" (click)="close()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#0F0F0F" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.586 12l-6.043 6.043 1.414 1.414L12 13.414l6.043 6.043 1.414-1.414L13.414 12l6.043-6.043-1.414-1.414L12 10.586 5.957 4.543 4.543 5.957 10.586 12z" fill="#0F0F0F"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="uc-category-dialog-body">
      <p class="uc-related-title">Related services</p>

      <div class="uc-group-grid">
        <button
          *ngFor="let group of visibleGroups"
          type="button"
          class="uc-group-card uc-group-link"
          [title]="group.name"
          (click)="groupSelected.emit(group)"
        >
          <div class="uc-group-img-wrap">
            <img *ngIf="group.image; else groupIcon" [src]="group.image" [alt]="group.name" class="uc-group-img" loading="lazy" decoding="async" />
            <ng-template #groupIcon>
              <app-service-icon [code]="category.code"></app-service-icon>
            </ng-template>
          </div>
          <span class="uc-group-name">{{ group.name }}</span>
        </button>

        <!-- "+N More" reveals the remaining groups -->
        <button
          *ngIf="isCollapsed"
          type="button"
          class="uc-group-card uc-group-more"
          (click)="showAll = true"
          [attr.aria-label]="'Show ' + hiddenCount + ' more services'"
        >
          <div class="uc-group-img-wrap uc-more-tile">
            <span class="uc-more-count">+{{ hiddenCount }}</span>
          </div>
          <span class="uc-group-name">More</span>
        </button>
      </div>
    </div>
  </div>
</div>
