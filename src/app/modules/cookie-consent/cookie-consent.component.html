<div
  class="uc-cookie-banner"
  *ngIf="visible"
  [class.closing]="closing"
  role="dialog"
  aria-live="polite"
  aria-label="Cookie consent"
>
  <div class="uc-cookie-text">
    <p class="uc-cookie-title">We value your privacy</p>
    <p class="uc-cookie-desc">
      We use cookies to keep you signed in, remember your cart and improve your experience.
      You can accept all cookies or reject the non-essential ones.
    </p>
  </div>
  <div class="uc-cookie-actions">
    <button type="button" class="uc-cookie-btn uc-cookie-btn-ghost" (click)="reject()">Reject all</button>
    <button type="button" class="uc-cookie-btn uc-cookie-btn-primary" (click)="accept()">Accept all</button>
  </div>
</div>
